<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写真解析中... - Claude Code</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e5e7eb; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { padding: 20px 0; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
    .status { padding: 8px 16px; border-radius: 20px; font-size: 0.875rem; font-weight: 600; }
    .status.running { background: #f59e0b; color: #000; }
    .status.complete { background: #10b981; }
    .status.error { background: #ef4444; }

    .folder-info { background: #2d2d44; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
    .folder-info .label { color: #9ca3af; font-size: 0.875rem; }
    .folder-info .path { color: #60a5fa; font-family: monospace; word-break: break-all; }

    .log-container { background: #0d1117; border-radius: 8px; padding: 16px; margin-bottom: 20px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; }
    .log-entry { margin-bottom: 4px; padding: 2px 0; }
    .log-entry.info { color: #8b949e; }
    .log-entry.success { color: #3fb950; }
    .log-entry.error { color: #f85149; }
    .log-entry.complete { color: #58a6ff; font-weight: bold; }

    .progress-bar { background: #2d2d44; border-radius: 8px; height: 8px; margin-bottom: 20px; overflow: hidden; }
    .progress-bar .fill { background: linear-gradient(90deg, #3b82f6, #10b981); height: 100%; transition: width 0.3s; }

    .results { margin-top: 20px; }
    .photo-card { background: #2d2d44; border-radius: 12px; padding: 16px; margin-bottom: 16px; display: flex; gap: 16px; }
    .photo-card img { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; background: #1a1a2e; }
    .photo-info { flex: 1; }
    .photo-info h3 { font-size: 1rem; color: #f3f4f6; margin-bottom: 8px; }
    .photo-info .field { margin-bottom: 4px; font-size: 0.875rem; }
    .photo-info .label { color: #9ca3af; display: inline-block; width: 60px; }
    .photo-info .value { color: #e5e7eb; }

    .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-success { background: #10b981; color: white; }
    .btn-success:hover { background: #059669; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #4b5563; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><span class="spinner" id="spinner"></span>写真解析 (Claude Code)</h1>
      <div id="status" class="status running">解析中...</div>
    </header>

    <div class="folder-info">
      <div class="label">解析フォルダ:</div>
      <div class="path" id="folderPath">取得中...</div>
    </div>

    <div class="progress-bar">
      <div class="fill" id="progressFill" style="width: 0%"></div>
    </div>

    <div class="log-container" id="logContainer"></div>

    <div class="actions" id="actions" style="display:none;">
      <button class="btn btn-primary" id="exportJson">JSON出力</button>
      <button class="btn btn-success" id="exportCsv">CSV出力</button>
      <button class="btn btn-danger" id="shutdown">終了</button>
    </div>

    <div id="results" class="results"></div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3001';
    const logContainer = document.getElementById('logContainer');
    const statusEl = document.getElementById('status');
    const spinnerEl = document.getElementById('spinner');
    const folderPathEl = document.getElementById('folderPath');
    const progressFill = document.getElementById('progressFill');
    const actionsEl = document.getElementById('actions');
    const resultsEl = document.getElementById('results');

    let currentResults = null;
    let totalPhotos = 0;
    let processedPhotos = 0;

    // ログ追加
    function addLog(msg, type = 'info') {
      if (msg === 'ANALYSIS_COMPLETE') {
        onComplete();
        return;
      }

      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;

      // 進捗更新
      const progressMatch = msg.match(/\[(\d+)\/(\d+)\]/);
      if (progressMatch) {
        processedPhotos = parseInt(progressMatch[1]);
        totalPhotos = parseInt(progressMatch[2]);
        const percent = (processedPhotos / totalPhotos) * 100;
        progressFill.style.width = `${percent}%`;
      }

      // 画像数検出
      const countMatch = msg.match(/(\d+)枚の画像を検出/);
      if (countMatch) {
        totalPhotos = parseInt(countMatch[1]);
      }
    }

    // 完了時処理
    async function onComplete() {
      spinnerEl.style.display = 'none';
      statusEl.textContent = '完了';
      statusEl.className = 'status complete';
      progressFill.style.width = '100%';
      document.title = '解析完了 - Claude Code';

      // 結果取得
      try {
        const res = await fetch(`${API_BASE}/api/results`);
        const data = await res.json();

        if (data.success && data.results) {
          currentResults = data.results;
          displayResults(data.results);
          actionsEl.style.display = 'flex';
        } else if (data.error) {
          addLog(`エラー: ${data.error}`, 'error');
          statusEl.textContent = 'エラー';
          statusEl.className = 'status error';
        }
      } catch (err) {
        addLog(`結果取得エラー: ${err.message}`, 'error');
      }
    }

    // 結果表示
    function displayResults(results) {
      resultsEl.innerHTML = results.map(r => `
        <div class="photo-card">
          <div style="width:120px;height:120px;background:#3d3d5c;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:0.75rem;">
            ${r.fileName.substring(0, 10)}...
          </div>
          <div class="photo-info">
            <h3>${r.fileName}</h3>
            <div class="field"><span class="label">工種:</span> <span class="value">${r.workType || '-'}</span></div>
            <div class="field"><span class="label">種別:</span> <span class="value">${r.variety || '-'}</span></div>
            <div class="field"><span class="label">細別:</span> <span class="value">${r.detail || '-'}</span></div>
            <div class="field"><span class="label">測点:</span> <span class="value">${r.station || '-'}</span></div>
            <div class="field"><span class="label">備考:</span> <span class="value">${r.remarks || '-'}</span></div>
            <div class="field"><span class="label">説明:</span> <span class="value">${r.description || '-'}</span></div>
          </div>
        </div>
      `).join('');
    }

    // エクスポート
    function exportJson() {
      if (!currentResults) return;
      const blob = new Blob([JSON.stringify(currentResults, null, 2)], { type: 'application/json' });
      downloadBlob(blob, `photo-analysis-${Date.now()}.json`);
    }

    function exportCsv() {
      if (!currentResults) return;
      const headers = ['ファイル名', '工種', '種別', '細別', '測点', '備考', '説明'];
      const rows = currentResults.map(r => [
        r.fileName, r.workType || '', r.variety || '', r.detail || '',
        r.station || '', r.remarks || '', r.description || ''
      ]);
      const csvContent = [
        headers.join(','),
        ...rows.map(row => row.map(cell => `"${(cell || '').replace(/"/g, '""')}"`).join(','))
      ].join('\n');
      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8' });
      downloadBlob(blob, `photo-analysis-${Date.now()}.csv`);
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // サーバー終了
    async function shutdown() {
      if (!confirm('サーバーを終了しますか？')) return;
      try {
        await fetch(`${API_BASE}/api/shutdown`, { method: 'POST' });
        statusEl.textContent = '終了';
        addLog('サーバーを終了しました', 'info');
      } catch {}
    }

    // イベント
    document.getElementById('exportJson').addEventListener('click', exportJson);
    document.getElementById('exportCsv').addEventListener('click', exportCsv);
    document.getElementById('shutdown').addEventListener('click', shutdown);

    // SSE接続
    function connectSSE() {
      const eventSource = new EventSource(`${API_BASE}/api/logs`);
      eventSource.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          addLog(data.message, data.type);
        } catch {}
      };
      eventSource.onerror = () => {
        addLog('接続が切断されました', 'error');
      };
    }

    // 初期化
    async function init() {
      // フォルダパス取得
      try {
        const res = await fetch(`${API_BASE}/api/status`);
        const data = await res.json();
        folderPathEl.textContent = data.folderPath || '不明';

        if (data.complete) {
          onComplete();
        }
      } catch (err) {
        folderPathEl.textContent = 'サーバー接続エラー';
      }

      connectSSE();
    }

    init();
  </script>
</body>
</html>
