name: Sync Learned Data to Main

on:
  push:
    branches:
      - data/learned-settings
    paths:
      - 'src/data/learned-settings.json'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Fetch data branch
        run: git fetch origin data/learned-settings

      - name: Merge learned data
        run: |
          git merge origin/data/learned-settings --no-edit -m "chore: sync learned data from app"

      - name: Push to main
        run: git push origin main
