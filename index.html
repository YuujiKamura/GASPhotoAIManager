<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP: CDN script origins (jsdelivr/cdnjs) removed after P1 of #179.
      All 3rd-party JS (ExcelJS / file-saver / JSZip / exif-js) is now bundled
      via npm+Vite. html2pdf.js is no longer shipped at runtime (only referenced
      by offline puppeteer test scripts under scripts/).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://generativelanguage.googleapis.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:;">
    <title>工事写真帳メーカー - Construction Album Maker</title>
    <!-- Tailwind CSS is bundled via PostCSS -->
    <script>
      // Minimal process polyfill retained for libraries that probe `process.env`
      // at import time. Do not re-introduce runtime script tags from CDNs.
      window.process = window.process || { env: { NODE_ENV: 'production' } };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap');
      body {
        font-family: 'Noto Sans JP', sans-serif;
      }

      /* Screen Styles for the Sheet Preview */
      .sheet-preview {
        width: 210mm;
        min-height: 297mm;
        background: white;
        margin: 0 auto 2rem auto;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        position: relative;
        box-sizing: border-box;
      }

      /* PDF Generation Mode Overrides */
      /* These styles activate when the 'pdf-mode' class is added to the container during export */
      .pdf-mode .sheet-preview {
        /* Force exact height slightly less than A4 to prevent micro-spillover causing blank pages */
        height: 295mm !important; 
        min-height: 295mm !important;
        max-height: 295mm !important;
        width: 210mm !important;
        
        /* Remove screen-only styling */
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
        
        /* Clip any content that might push boundaries */
        overflow: hidden !important;
        
        /* Ensure clean breaks */
        page-break-after: always !important;
        page-break-inside: avoid !important;
      }

      /* Prevent the last page from creating an empty page after it */
      .pdf-mode .sheet-preview:last-child {
        page-break-after: avoid !important;
      }

      /* PDF Visibility Helpers:
         Allows switching between 'Input' (Edit) and 'Div' (Print) 
         to ensure text wraps correctly in PDF. 
      */
      .pdf-visible { display: none; }
      .pdf-mode .pdf-visible { display: block !important; }
      .pdf-mode .pdf-hidden { display: none !important; }

      /* html2canvas cannot parse oklch colors; force safe RGB colors in PDF mode */
      .pdf-mode, .pdf-mode * {
        color: #111111 !important;
        background-color: #ffffff !important;
        border-color: #b3b3b3 !important;
        box-shadow: none !important;
      }
      .pdf-mode img {
        background-color: transparent !important;
      }
    </style>
  </head>
  <body class="bg-gray-100 text-gray-900 antialiased">
    <div id="root">
      <div style="padding: 20px; font-family: sans-serif;">
        <h1>工事写真帳メーカーを読み込み中...</h1>
        <p>If this message persists, there may be a JavaScript error.</p>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
